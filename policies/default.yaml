# AI-AGENT-AUDIT 默认策略 —— 完整示例（02 文档 §5 schema，03 文档 T3.1/T3.5）
# 出厂默认 dry-run：只告警不阻断（02 文档 §0 安全红线）；切 enforce 需显式修改本文件。
version: 1
mode: dry-run # dry-run | enforce
defaults:
  fail_open: true # 引擎异常放行并记 error（02 文档 D5）
  max_body_scan: 262144 # 内容扫描截断上限 256KB（02 文档 D6）

domains:
  classes:
    known_ai_api:
      - api.anthropic.com
      - api.openai.com
      - generativelanguage.googleapis.com
      - api.deepseek.com
      - api.moonshot.cn
      - openrouter.ai
      - api.x.ai
    code_hosting:
      - github.com
      - api.github.com
      - gitlab.com
  rules:
    - id: domain-unknown # 未知域名首连告警（unknown 首连）
      match: { class: unknown }
      action: alert
      weight: 20
    - id: domain-blocklist # 恶意域名：CONNECT/SNI 阶段直接阻断（enforce）
      match: { host_regex: '\.example-mal\.com$' }
      action: block
      weight: 80

processes:
  profiles:
    agent_cli: { exe_regex: '(?i)(claude|cursor|codex|copilot|node|python|java)' }
    browser: { exe_regex: '(?i)(chrome|msedge|firefox)\.exe$' }
  rules:
    - id: non-agent-to-ai-api # 非 AI 进程访问 AI 端点
      match: { profile_not: agent_cli, dest_class: known_ai_api }
      action: alert
      weight: 30

content:
  scanners: [secrets, pii, code_leak]
  rules:
    - id: secret-leak # 任何疑似密钥外发
      scanner: secrets
      action: block
      weight: 60
    - id: pii-bulk # PII 批量外发（阈值命中数 > 10）
      scanner: pii
      match: { hits_gt: 10 }
      action: confirm
      weight: 40
    - id: code-bulk-upload # 大体量 + 高代码相似度（代码外发）
      match: { body_size_gt: 512000, code_likeness_gt: 0.6 }
      action: confirm
      weight: 40

volume:
  - id: huge-body # 单请求体量超 5MB
    match: { body_size_gt: 5242880 }
    action: alert
    weight: 20

time_window:
  - id: burst # 进程×域名 滑动窗口速率（60s 内 > 60 次）
    match: { requests_gt: 60, window_seconds: 60 }
    action: alert
    weight: 20

# 告警通知（04 文档 §2）：达到 min_action 门槛的事件即时通知用户，无需打开面板。
# 老策略文件无本段=全关；段落存在但省略字段时按字段默认（toast 开）。
notifications:
  min_action: alert        # 通知门槛：alert | confirm | block（block 为最高）
  toast:
    enabled: true          # Windows 系统通知（PowerShell WinRT，零依赖，本机无外发）
  webhook:
    enabled: false
    provider: generic      # generic | wecom | dingtalk | feishu | slack | discord
    url: ""                # 环境变量 AAA_WEBHOOK_URL 优先（url 内嵌 token，勿外传）
  email:
    enabled: false
    smtp_host: ""
    smtp_port: 465
    use_tls: true
    username: ""
    password: ""           # 仅存本机策略文件；环境变量 AAA_SMTP_PASSWORD 优先
    from_addr: ""
    to_addrs: []           # 列表
  rate_limit:
    max_per_minute: 10     # 每通道滑动窗口；超出部分合并为一条 digest

# ---------------------------------------------------------------------------
# v0.2.0 安全深化新段（docs/05-security-deepening-plan.md 波次二）：
# 以下全部默认关闭/空——开启方法见 README「安全深化」小节。
# ---------------------------------------------------------------------------

# 仓库指纹（05 文档 W1）：外发请求体与本地代码库切片比对，防"整段代码外发"。
fingerprint:
  enabled: false
  repos: []                # 仓库工作区路径清单；aaa fingerprint build --repo PATH 逐个建库
  min_hits: 1              # 命中多少片算一次有效命中

# LLM 辅助判定（05 文档 W3）：对 alert 级以上事件摘要做第二意见判定（OpenAI 兼容端点）。
# API key 只从环境变量 AAA_JUDGE_API_KEY 读取，绝不落盘；开启后才有外发（直连不走代理）。
judge:
  enabled: false
  api_base: ""             # 如 https://api.openai.com/v1（不含 /chat/completions）
  model: ""                # 如 gpt-4o-mini
  timeout: 8               # 单次请求超时秒数
  max_events_per_day: 200  # 每日预算（只累计成功取得结论的调用）

# 响应侧注入标注（05 文档 W4/波次二 §3）：扫描响应体中的提示词注入特征。
# 响应侧只做 alert 级标注、绝不阻断响应；rules 为空 = 功能关闭。
response:
  rules: []
  # 取消注释启用（patterns: all=任何注入特征命中；high=仅高危——指令覆盖/隐藏载体）：
  # - id: response-injection
  #   patterns: all
  #   action: alert         # 响应侧只支持 alert，写其他值策略校验直接失败

# 证据静态加密（05 文档 W5）：AES-256-GCM，请求 body 证据落盘加密。
# 密钥来源：data/.crypto-key 自动生成，或环境变量 AAA_MASTER_PASSWORD 口令派生；
# 关闭时写入明文、读取仍透明兼容既有密文。开关在 aaa run 启动时生效（不热切换）。
encrypt:
  enabled: false
