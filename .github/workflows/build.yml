name: Build

# 打包各平台单文件可执行（PyInstaller 跨平台交叉编译不可行，按矩阵各跑一份）。
# 推 v* 标签时构建并发布 GitHub Release；平时可手动触发仅上传 artifacts。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runs-on }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runs-on: windows-latest, os: windows, arch: amd64, experimental: false }
          - { runs-on: windows-11-arm, os: windows, arch: arm64, experimental: true }
          - { runs-on: ubuntu-latest, os: linux, arch: amd64, experimental: true }
          - { runs-on: ubuntu-24.04-arm, os: linux, arch: arm64, experimental: true }
          - { runs-on: macos-15-intel, os: macos, arch: amd64, experimental: true }
          - { runs-on: macos-latest, os: macos, arch: arm64, experimental: true }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev,web]" "pyinstaller>=6.0"
      - name: Build onefile executable
        shell: bash
        run: |
          python build_exe.py 2>&1 | tee build-output.txt
          test ${PIPESTATUS[0]} -eq 0
      - name: 失败摘录写入 annotation（供公开 API 排障）
        if: failure()
        shell: bash
        run: |
          tail -20 build-output.txt | while IFS= read -r line; do
            echo "::error::${line:0:450}"
          done
      - name: Stage release artifact
        shell: bash
        run: |
          mkdir -p release
          if [[ "${{ matrix.os }}" == "windows" ]]; then
            cp dist/ai-agent-audit.exe "release/egress-sentinel-${{ matrix.os }}-${{ matrix.arch }}.exe"
          else
            cp dist/ai-agent-audit "release/egress-sentinel-${{ matrix.os }}-${{ matrix.arch }}"
          fi
          ls -la release/
      - uses: actions/upload-artifact@v4
        with:
          name: egress-sentinel-${{ matrix.os }}-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error
      - name: Generate release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/release_notes.py "${GITHUB_REF_NAME}" > release-notes.md
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: release/*
          fail_on_unmatched_files: true

  # Windows 安装器（Inno Setup，06 文档 W3）：仅 windows-amd64、仅 tag 触发。
  # 复用 build job 的 windows-amd64 onefile 产物，编译出
  # egress-sentinel-setup-v<版本>.exe 上传 artifact 并挂到同一 Release。
  # 版本号经 scripts/iss_version.py 从 pyproject.toml 读取后 /DMyAppVersion 注入。
  installer:
    name: installer-windows-amd64
    runs-on: windows-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download windows-amd64 exe from build job
        uses: actions/download-artifact@v4
        with:
          # 必须与 build job upload-artifact 的 name 完全一致（test_installer.py 对账）
          name: egress-sentinel-windows-amd64
          path: downloaded
      - name: Place exe where ISS expects it
        shell: bash
        run: |
          mkdir -p dist
          cp downloaded/egress-sentinel-windows-amd64.exe dist/ai-agent-audit.exe
          ls -la dist/
      - name: Resolve version from pyproject
        id: ver
        shell: bash
        run: |
          VERSION=$(python scripts/iss_version.py)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Installer version: $VERSION"
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Compile installer (ISCC)
        shell: pwsh
        env:
          AAA_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $candidates = @(
            (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source,
            (Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"),
            (Join-Path $env:ProgramFiles "Inno Setup 6\ISCC.exe")
          )
          $iscc = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe 未找到：choco install innosetup 未生效？" }
          Write-Host "ISCC: $iscc"
          & $iscc "/DMyAppVersion=$env:AAA_VERSION" (Resolve-Path "installer/egress-sentinel.iss")
          if ($LASTEXITCODE -ne 0) { throw "ISCC 编译失败（exit=$LASTEXITCODE）" }
          Get-ChildItem dist/egress-sentinel-setup-*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: egress-sentinel-setup-windows-amd64
          path: dist/egress-sentinel-setup-*.exe
          if-no-files-found: error
      - name: Upload installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/egress-sentinel-setup-*.exe
          fail_on_unmatched_files: true
